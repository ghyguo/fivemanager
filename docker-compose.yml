services:
  mysql:
    image: mysql:8.0
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fourhigh_survey}
      MYSQL_USER: ${MYSQL_USER:-survey}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./V1__init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-fourhigh_survey}
      DB_USER: ${MYSQL_USER:-survey}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET:?Set QR_TOKEN_SECRET in .env}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?Set ADMIN_INIT_PASSWORD in .env}
      RATE_LIMIT_PER_MINUTE_PER_IP: ${RATE_LIMIT_PER_MINUTE_PER_IP:-600}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
